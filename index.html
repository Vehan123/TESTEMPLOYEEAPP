<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-dark" data-theme="dark">

  <!-- Background canvas for particle effects -->
  <canvas id="bgCanvas"></canvas>

  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">🍅 Pomodoro Timer</h1>
      <div class="header-controls">
        <button id="themeBtn" class="icon-btn" title="Switch Theme">🎨</button>
        <button id="soundBtn" class="icon-btn" title="Toggle Sound">🔊</button>
        <button id="statsBtn" class="icon-btn" title="Statistics">📊</button>
      </div>
    </header>

    <!-- Main Timer Area -->
    <main class="main-content">
      <!-- Pattern A: Circular Progress Bar -->
      <div class="timer-container">
        <svg class="progress-ring" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--gradient-start)" />
              <stop offset="100%" stop-color="var(--gradient-end)" />
            </linearGradient>
          </defs>
          <!-- Background track -->
          <circle class="ring-track" cx="110" cy="110" r="95" />
          <!-- Progress arc -->
          <circle class="ring-progress" cx="110" cy="110" r="95"
            stroke="url(#timerGradient)" />
        </svg>

        <div class="timer-display">
          <div class="session-label" id="sessionLabel">Focus Time</div>
          <div class="time-text" id="timeDisplay">25:00</div>
          <div class="session-count" id="sessionCount">Session 1</div>
        </div>
      </div>

      <!-- Pattern B: Time Setting Selector -->
      <div class="time-selector">
        <span class="selector-label">Focus Duration</span>
        <div class="duration-options">
          <button class="duration-btn" data-minutes="15">15 min</button>
          <button class="duration-btn active" data-minutes="25">25 min</button>
          <button class="duration-btn" data-minutes="35">35 min</button>
          <button class="duration-btn" data-minutes="45">45 min</button>
        </div>
      </div>

      <!-- Timer Controls -->
      <div class="timer-controls">
        <button id="startBtn" class="control-btn primary">▶ Start</button>
        <button id="resetBtn" class="control-btn secondary">↺ Reset</button>
        <button id="skipBtn" class="control-btn secondary">⏭ Skip</button>
      </div>

      <!-- Pattern C: XP & Level -->
      <div class="xp-bar-section">
        <div class="level-badge" id="levelBadge">
          <span class="level-label">Lv.</span>
          <span class="level-num" id="levelNum">1</span>
        </div>
        <div class="xp-bar-wrapper">
          <div class="xp-bar-fill" id="xpBarFill"></div>
        </div>
        <div class="xp-text" id="xpText">0 / 100 XP</div>
      </div>
    </main>

    <!-- Sound Settings Panel -->
    <div class="panel" id="soundPanel">
      <h2 class="panel-title">🔊 Sound Settings</h2>
      <div class="sound-option">
        <label class="toggle-label">
          <span>Start Sound</span>
          <input type="checkbox" id="soundStart" checked />
          <span class="toggle-switch"></span>
        </label>
      </div>
      <div class="sound-option">
        <label class="toggle-label">
          <span>End / Break Sound</span>
          <input type="checkbox" id="soundEnd" checked />
          <span class="toggle-switch"></span>
        </label>
      </div>
      <div class="sound-option">
        <label class="toggle-label">
          <span>Tick Sound</span>
          <input type="checkbox" id="soundTick" />
          <span class="toggle-switch"></span>
        </label>
      </div>
    </div>

    <!-- Theme Panel -->
    <div class="panel" id="themePanel">
      <h2 class="panel-title">🎨 Theme</h2>
      <div class="theme-options">
        <button class="theme-option" data-theme="dark">🌙 Dark</button>
        <button class="theme-option" data-theme="light">☀️ Light</button>
        <button class="theme-option" data-theme="focus">🎯 Focus</button>
      </div>
    </div>

    <!-- Statistics Panel -->
    <div class="panel" id="statsPanel">
      <h2 class="panel-title">📊 Statistics</h2>

      <div class="stats-overview">
        <div class="stat-card">
          <div class="stat-value" id="statToday">0</div>
          <div class="stat-label">Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statWeek">0</div>
          <div class="stat-label">This Week</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statStreak">0</div>
          <div class="stat-label">🔥 Day Streak</div>
        </div>
      </div>

      <!-- Weekly Bar Chart -->
      <h3 class="chart-title">Weekly Pomodoros</h3>
      <div class="bar-chart" id="weeklyChart"></div>

      <!-- Monthly Grid -->
      <h3 class="chart-title">Monthly Activity</h3>
      <div class="monthly-grid" id="monthlyGrid"></div>

      <!-- Achievements -->
      <h3 class="chart-title">🏆 Achievements</h3>
      <div class="achievements-grid" id="achievementsGrid"></div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
